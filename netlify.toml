# Deploy su Netlify. Indirizzo del progetto e opzioni sono pubblici. La chiave anon (VITE_SUPABASE_ANON_KEY) NON sta nel repo: si imposta nelle variabili di Netlify.
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  VITE_SUPABASE_URL = "https://ooqlfldcrnkudhgjnied.supabase.co"
  VITE_FEATURE_RANDAI = "false"
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY"
  # VITE_SUPABASE_ANON_KEY si imposta in Netlify (Project configuration → Environment variables): non va scritta nel repo.
